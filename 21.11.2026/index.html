<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Linkhub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="linkhub" aria-labelledby="title">
        <h1 id="title">Linkhub</h1>
        <nav class="links" aria-label="Social links">
            <a class="link-card linkedin" href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <img src="linkedin.svg" alt="" width="34" height="34">
                <span>LinkedIn</span>
                <b aria-hidden="true">↗</b>
            </a>
            <a class="link-card discord" href="https://discord.com" target="_blank" rel="noopener noreferrer" aria-label="Discord">
                <img src="discord.svg" alt="" width="34" height="34">
                <span>Discord</span>
                <b aria-hidden="true">↗</b>
            </a>
            <a class="link-card telegram" href="https://telegram.org" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                <img src="telegram.svg" alt="" width="34" height="34">
                <span>Telegram</span>
                <b aria-hidden="true">↗</b>
            </a>
            <a class="link-card duolingo" href="https://duolingo.com" target="_blank" rel="noopener noreferrer" aria-label="Duolingo">
                <img src="duolingo.svg" alt="" width="34" height="34">
                <span>Duolingo</span>
                <b aria-hidden="true">↗</b>
            </a>
        </nav>
    </main>
    <script src="script.js"></script>
</body>
</html>
