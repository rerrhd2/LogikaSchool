<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&amp;display=swap" rel="stylesheet">

    <meta charset="UTF-8">

    <title> rerrhd Quiz</title>

<body>

<div class="app-container">

    <div id="start-screen" class="screen">
        <h2 class="Logo">rerrhd | Quiz</h2>
        <button id="start-btn">▶   Почати</button>
    </div>
    <img src="images/Снимок экрана 2026-11-07 161556.png">

    <div id="quiz-screen" class="screen hide">
        <h2 id="question-text">Запитання 1</h2>
        <p>Час: <span id="timer">15</span> сек.</p>
        <div id="answers-container"></div>
        <a href="#" id="IDK">Я не знаю</a>
    </div>

    <div id="result-screen" class="screen hide">
        <h2>Квіз завершено!</h2>
        <p class="result-text"></p>
        <p>Правильних відповідей: <span id="final-score">0</span></p>
        <button id="restart-btn">Спробувати ще</button>
    </div>

</div>

<script src="script.js"></script>
